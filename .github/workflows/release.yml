name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release "-DX21_APP_VERSION=$version"

      - name: Build
        run: cmake --build build --config Release --target X21_CHAT

      - name: Package app and artwork
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = Join-Path $env:RUNNER_TEMP "x21-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = "build/Release/X21_CHEATS_GITHUB.exe"
          Copy-Item $exe $stage
          Copy-Item "assets" $stage -Recurse
          $zip = "X21_CHEATS-$tag-win-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  X21_CHEATS_GITHUB.exe" | Set-Content -Encoding ascii "X21_CHEATS_GITHUB.exe.sha256"
          "ASSET_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ASSET_ZIP }}
            ${{ env.ASSET_ZIP }}.sha256
            build/Release/X21_CHEATS_GITHUB.exe
            X21_CHEATS_GITHUB.exe.sha256
